services:
  mysql:
    image: mysql:8.4
    container_name: solcacao-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-solcacao}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - solcacao_mysql_data:/var/lib/mysql
      - ./db/schema/solcacao_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  solcacao_mysql_data:
